{{ define "main" }}
<header class="articles-hero">
    <div class="container">
        <div class="articles-hero-content">
            <h1 class="articles-hero-title">Journal</h1>
            <p class="articles-hero-subtitle">
                Thoughts, insights, and updates from my journey
            </p>
        </div>
    </div>
</header>

<section class="articles-list-section">
    <div class="container">
        <div class="articles-grid">
            {{ range .Pages }}
                {{ if not .Draft }}
                    {{ partial "article-card.html" . }}
                {{ end }}
            {{ end }}
        </div>
    </div>
</section>
{{ end }}

{{ define "main" }}
{{ partial "page-hero.html" (dict "title" "Journal" "subtitle" "Thoughts, insights, and updates from my journey") }}

<section class="articles-list-section">
    <div class="container">
        <div class="articles-grid">
            {{ $publishedPages := where .RegularPages "Draft" false }}
            {{ range $publishedPages }}
                {{ partial "article-card.html" . }}
            {{ end }}
        </div>
    </div>
</section>
{{ end }}

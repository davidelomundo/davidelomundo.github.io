{{ define "main" }}
<header class="page-hero">
    <div class="container">
        <div class="page-hero-content">
            <h1 class="page-hero-title">Journal</h1>
            <p class="page-hero-subtitle">
                Thoughts, insights, and updates from my journey
            </p>
        </div>
    </div>
</header>

<section class="articles-list-section">
    <div class="container">
        <div class="articles-grid">
            {{ $publishedPages := where .RegularPages "Draft" false }}
            {{ range $publishedPages }}
                {{ partial "article-card.html" . }}
            {{ end }}
        </div>
    </div>
</section>
{{ end }}
